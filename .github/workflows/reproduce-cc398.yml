name: Reproduce CC398 analysis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce-cc398.yml"
      - "notebooks/CC398_Host_Associated_Genomic_Variation_Source_Audited.ipynb"

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert ipykernel

      - name: Execute source-audited notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path

          source = Path("notebooks/CC398_Host_Associated_Genomic_Variation_Source_Audited.ipynb")
          notebook = nbformat.read(source, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=300,
              kernel_name="python3",
              resources={"metadata": {"path": str(Path.cwd())}},
          )
          client.execute()
          output = Path("notebook-executions/CC398_Executed.ipynb")
          output.parent.mkdir(parents=True, exist_ok=True)
          nbformat.write(notebook, output)
          PY

      - name: Verify observed results and source checksums
        run: python scripts/verify_results.py

      - name: Publish exact notebook exports
        run: |
          mkdir -p results figures
          cp results_reconciled/*.csv results/
          cp results_reconciled/figure_01_cohort.png figures/
          cp results_reconciled/figure_02_mobile_elements.png figures/
          cp results_reconciled/figure_03_genes.png figures/
          cp notebook-executions/CC398_Executed.ipynb notebooks/CC398_Executed.ipynb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.csv figures/*.png notebooks/CC398_Executed.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified outputs from original CC398 workbooks"
            git push
          fi
